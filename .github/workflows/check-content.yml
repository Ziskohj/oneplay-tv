name: Check content health

# Verifica a diario que TODOS los enlaces del demo siguen vivos:
# streams live (m3u8) + pelis/series en archive.org (metadata API, con reintentos
# anti falso-muerto por rate-limit). Si una peli muere y hay espejo en
# scripts/mirrors.json, se auto-repara y commitea. Si quedan bajas, abre/actualiza
# una issue "Enlaces caídos"; si todo está sano, la cierra.
on:
  schedule:
    - cron: "30 3 * * *"    # a diario, a las 03:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: check-content
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar contenido
        id: check
        continue-on-error: true
        run: python3 scripts/check_content.py
      - name: Commit auto-reparaciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movies_all.json reports/health.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Auto-reparación de enlaces + informe de salud [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Abrir/actualizar issue si hay bajas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="⚠️ Enlaces caídos en el demo"
          CAIDOS=$(python3 -c "import json;print(len(json.load(open('reports/health.json'))['caidos']))")
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$CAIDOS" -gt 0 ]; then
            BODY_FILE=$(mktemp)
            {
              echo "El chequeo diario ha encontrado **$CAIDOS enlaces caídos** (tras reintentos anti rate-limit y auto-reparación por espejos)."
              echo
              echo '```json'
              python3 -c "import json;r=json.load(open('reports/health.json'));print(json.dumps({'caidos':r['caidos'],'auto_reparado':r['auto_reparado']},indent=2,ensure_ascii=False))"
              echo '```'
              echo
              echo "_Nota: fallos de streams live desde runners de EE.UU. pueden ser geo-bloqueo (p.ej. RTVE), no muerte real. Informe completo en reports/health.json._"
            } > "$BODY_FILE"
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body-file "$BODY_FILE"
            else
              gh issue create --title "$TITLE" --body-file "$BODY_FILE"
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Todo sano en el último chequeo ✅"
            fi
          fi
